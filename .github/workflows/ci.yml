name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tauri and hub build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/hub-web check && pnpm --dir apps/hub-web build
      - run: pnpm --dir apps/launcher check && pnpm --dir apps/launcher build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # ── Version ───────────────────────────────────────────────────────────────
  # Trailer-gated: a release only happens when HEAD carries a publish trailer.
  #   pre-release: true   → X.Y.Z-alpha, marked as a GitHub pre-release
  #   release: true       → X.Y.Z stable
  # Neither → CI runs tests only. The version is bumped from the last v* tag,
  # scanning conventional-commit subjects since that tag for the bump level
  # (0.x semantics: a breaking change bumps the minor, not the major).
  version:
    name: Calculate version
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.calc.outputs.version }}
      prerelease: ${{ steps.calc.outputs.prerelease }}
      do_release: ${{ steps.calc.outputs.do_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: calc
        run: |
          IS_RELEASE=$(git log -1 --format='%(trailers:key=release,valueonly)')
          IS_PRERELEASE=$(git log -1 --format='%(trailers:key=pre-release,valueonly)')

          if [[ "$IS_RELEASE" != "true" && "$IS_PRERELEASE" != "true" ]]; then
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            echo "No release/pre-release trailer on HEAD — tests only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          LAST_TAG=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          if [[ -z "$LAST_TAG" ]]; then
            PREV_MAJOR=0; PREV_MINOR=0; PREV_PATCH=0; RANGE="HEAD"
          else
            VER="${LAST_TAG#v}"; VER="${VER%%-*}"
            IFS='.' read -r PREV_MAJOR PREV_MINOR PREV_PATCH <<< "$VER"
            RANGE="${LAST_TAG}..HEAD"
          fi

          BUMP="none"
          while IFS= read -r HASH; do
            SUBJECT=$(git log -1 --format='%s' "$HASH")
            BODY=$(git log -1 --format='%b' "$HASH")
            if echo "$SUBJECT" | grep -qE '^[a-z]+(\(.+\))?!:' || echo "$BODY" | grep -qiE '^BREAKING[ -]CHANGE:'; then
              BUMP="major"
            elif echo "$SUBJECT" | grep -qE '^feat(\(.+\))?:' && [[ "$BUMP" != "major" ]]; then
              BUMP="minor"
            elif echo "$SUBJECT" | grep -qE '^(fix|perf|refactor|build|ci|docs|style|test|chore|revert)(\(.+\))?:' && [[ "$BUMP" == "none" ]]; then
              BUMP="patch"
            fi
          done < <(git log --format='%H' $RANGE)
          [[ "$BUMP" == "none" ]] && BUMP="patch"

          case "$BUMP" in
            major)
              if [[ "$PREV_MAJOR" -eq 0 ]]; then MAJOR=0; MINOR=$((PREV_MINOR + 1)); PATCH=0
              else MAJOR=$((PREV_MAJOR + 1)); MINOR=0; PATCH=0; fi ;;
            minor) MAJOR=$PREV_MAJOR; MINOR=$((PREV_MINOR + 1)); PATCH=0 ;;
            patch) MAJOR=$PREV_MAJOR; MINOR=$PREV_MINOR; PATCH=$((PREV_PATCH + 1)) ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          PRERELEASE=false
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            VERSION="${VERSION}-alpha"
            PRERELEASE=true
          fi

          echo "Calculated version: $VERSION (bump=$BUMP, prerelease=$PRERELEASE, from ${LAST_TAG:-none})"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "do_release=true" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## Release

          | | |
          |---|---|
          | **Version** | \`$VERSION\` |
          | **Bump** | $BUMP |
          | **Pre-release** | $PRERELEASE |
          | **Previous tag** | \`${LAST_TAG:-none}\` |
          SUMMARY

  # ── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build release artifacts
    needs: [version, check]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-release
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tauri build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Stamp version
        run: |
          V="${{ needs.version.outputs.version }}"
          sed -i '0,/^version = ".*"$/s//version = "'"$V"'"/' Cargo.toml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/hub-web build && pnpm --dir apps/launcher build
      - run: cargo build --release -p cell-hub -p cell-launcher-app
      - name: Stage assets
        run: |
          V="${{ needs.version.outputs.version }}"
          mkdir -p dist
          cp target/release/cell-hub "dist/cell-hub-$V-linux-x86_64"
          cp target/release/cell-launcher-app "dist/cell-launcher-app-$V-linux-x86_64"
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: bin-linux-x86_64
          path: dist/*
          retention-days: 1

  # ── Release ───────────────────────────────────────────────────────────────
  # Tag the commit and cut a GitHub (pre-)release with the artifacts attached.
  release:
    name: Create GitHub release
    needs: [version, build]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: bin-*
      - name: Tag
        run: |
          V="${{ needs.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$V"
          git push origin "v$V"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: dist/**/*

  # ── Container image ───────────────────────────────────────────────────────
  # Build the hub image and push it to GHCR as ghcr.io/<owner>/cell-hub:<version>
  # (+ :latest), per release.
  image:
    name: Build & push hub image
    needs: [version, check]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image ref (lowercase owner)
        id: ref
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cell-hub" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.hub
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}:${{ needs.version.outputs.version }}
            ${{ steps.ref.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
