[workspace]
resolver = "2"
members = ["crates/cell-hub-api", "crates/cell-identity", "crates/cell-hub", "apps/launcher/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
flate2 = "1"
# The file format, from the cell repository.
cell-core = { git = "https://github.com/wiltaylor/cell.git", tag = "v0.3.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
